server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: media-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/media/**

            - id: patient-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/**

            - id: admin-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/admin/**

            - id: ai-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/ai/**

            - id: appointment-service
              uri: http://localhost:8086
              predicates:
                - Path=/appointments/**
              filters:
                - RewritePath=/api/appointments/(?<remaining>.*), /appointments/${remaining}

            - id: doctor-service
              uri: http://localhost:8087
              predicates:
                - Path=/doctors/**

            - id: scheduling-service
              uri: http://localhost:8088
              predicates:
                - Path=/clinics/**, /specialties/**, /slots/**, /work-schedules/**, /schedule-change-requests/**, /rooms/**, /replacement-doctors/**, /leave-requests/**, /api/health

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
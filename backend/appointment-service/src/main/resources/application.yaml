spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: appointment-service

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mediq_appointment}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8086

jwt:
  secret: ${JWT_SECRET}

services:
  scheduling:
    url: ${SCHEDULING_SERVICE_URL:http://localhost:8088}
  doctor:
    url: http://localhost:8087